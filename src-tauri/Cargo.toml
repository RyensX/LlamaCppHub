[package]
name = "llamacpphub"
version = "0.1.0"
description = "LlamaCppHub"
authors = ["Ryens"]
edition = "2021"

[[bin]]
name = "llamacpphub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png"] }
tauri-plugin-shell = { version = "2" }
tauri-plugin-dialog = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt", "sync", "macros", "rt-multi-thread", "process"] }
thiserror = "1"
dirs = "5"
sysinfo = "0.33"
windows-core = "0.58"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
